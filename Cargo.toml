[package]
name = "ignition"
version = "0.1.0"
edition = "2021"
description = "A deterministic boot-sequence simulator with real partition, config, and ELF-like kernel-image parsers and loaders"
license = "MIT"
repository = "https://github.com/pavanchow/ignition"
readme = "README.md"

[[bin]]
name = "ignition"
path = "src/bin/ignition.rs"

[lib]
name = "ignition"
path = "src/lib.rs"

[profile.release]
opt-level = 3
